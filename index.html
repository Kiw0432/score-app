<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>สกอร์บอร์ด 2 ทีม</title>
<style>
  :root {
    --bg: #05060a;
    --card-bg: #1a1d24;
    --text: #f4f4f5;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
  }

  /* ---------- หน้าแรก (เลือกโหมด) ---------- */
  #home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    text-align: center;
  }
  #home h1 { font-size: 24px; margin: 0; }
  #home p { color: var(--muted); margin: 0; max-width: 340px; }
  .home-links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .home-links a {
    display: block;
    padding: 20px 32px;
    background: var(--card-bg);
    border-radius: 16px;
    color: var(--text);
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
    border: 1px solid #2a2d35;
  }
  .home-links a:active { filter: brightness(1.2); }

  /* ---------- โหมด Control ---------- */
  #controlView { display: none; min-height: 100vh; padding: 16px; flex-direction: column; gap: 16px; }
  .status { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.error { color: #f87171; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; }
  .team-card {
    background: var(--card-bg); border-radius: 20px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px; border-top: 6px solid var(--c);
  }
  .team-card.a { --c: var(--team-a-color, #3b82f6); }
  .team-card.b { --c: var(--team-b-color, #ef4444); }
  .name-row { display: flex; gap: 8px; align-items: center; }
  .name-input {
    flex: 1; background: #000; border: 1px solid #333; color: var(--text);
    font-size: 16px; padding: 8px 10px; border-radius: 10px; min-width: 0;
  }
  input[type="color"] { width: 40px; height: 40px; border: none; border-radius: 10px; background: none; padding: 0; cursor: pointer; }
  .score-display { text-align: center; font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--c); }
  .btn-row { display: flex; flex-direction: column; gap: 10px; }
  button { border: none; border-radius: 14px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .btn-plus { background: var(--c); color: #fff; font-size: 40px; padding: 20px 0; }
  .btn-plus:active { filter: brightness(0.85); transform: scale(0.98); }
  .btn-minus { background: #26292f; color: var(--text); font-size: 24px; padding: 12px 0; }
  .btn-minus:active { filter: brightness(1.2); }
  .global-actions { display: flex; justify-content: center; gap: 12px; }
  .btn-reset { background: #26292f; color: #f87171; padding: 12px 24px; font-size: 15px; }
  .btn-home { background: #26292f; color: var(--muted); padding: 12px 24px; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; }

  /* ---------- โหมด Display ---------- */
  #displayView { display: none; height: 100vh; width: 100vw; overflow: hidden; }
  .board { display: flex; height: 100%; width: 100%; }
  .team { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; position: relative; transition: background 0.3s ease; }
  .team.a { background: linear-gradient(160deg, var(--ca) 0%, #05060a 140%); }
  .team.b { background: linear-gradient(200deg, var(--cb) 0%, #05060a 140%); }
  .team-name { font-size: 5vw; font-weight: 700; letter-spacing: 0.02em; text-align: center; padding: 0 4vw; word-break: break-word; }
  .team-score { font-size: 22vw; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; transition: transform 0.15s ease; }
  .team-score.pulse { animation: pulse 0.35s ease; }
  @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .divider { width: 2px; background: rgba(255,255,255,0.15); }
  .vs {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 2vw; color: rgba(255,255,255,0.4); font-weight: 700; z-index: 2;
    background: #05060a; padding: 0.5vw 1.2vw; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);
  }

  .connecting-overlay {
    position: fixed; inset: 0; background: rgba(5,6,10,0.95); display: flex;
    align-items: center; justify-content: center; font-size: 16px; color: var(--muted); z-index: 10;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ================= หน้าแรก เลือกโหมด ================= -->
<div id="home">
  <h1>🏆 สกอร์บอร์ด 2 ทีม</h1>
  <p>เลือกโหมดที่ต้องการเปิดในอุปกรณ์นี้</p>
  <div class="home-links">
    <a href="?mode=display">📺 จอโชว์คะแนน</a>
    <a href="?mode=control">🎮 จอกดนับแต้ม</a>
  </div>
</div>

<!-- ================= โหมด Control ================= -->
<div id="controlView">
  <div class="status" id="statusText"></div>
  <div class="teams">
    <div class="team-card a">
      <div class="name-row">
        <input type="color" id="colorA" value="#3b82f6" />
        <input type="text" id="nameA" class="name-input" value="ทีม A" maxlength="20" />
      </div>
      <div class="score-display" id="scoreA">0</div>
      <div class="btn-row">
        <button class="btn-plus" id="plusA">+1</button>
        <button class="btn-minus" id="minusA">−1</button>
      </div>
    </div>
    <div class="team-card b">
      <div class="name-row">
        <input type="color" id="colorB" value="#ef4444" />
        <input type="text" id="nameB" class="name-input" value="ทีม B" maxlength="20" />
      </div>
      <div class="score-display" id="scoreB">0</div>
      <div class="btn-row">
        <button class="btn-plus" id="plusB">+1</button>
        <button class="btn-minus" id="minusB">−1</button>
      </div>
    </div>
  </div>
  <div class="global-actions">
    <a class="btn-home" href="?">← กลับหน้าแรก</a>
    <button class="btn-reset" id="resetBtn">รีเซ็ตคะแนน</button>
  </div>
</div>

<!-- ================= โหมด Display ================= -->
<div id="displayView">
  <div class="board" id="board" style="--ca:#3b82f6; --cb:#ef4444;">
    <div class="team a" id="teamA">
      <div class="team-name" id="dispNameA">ทีม A</div>
      <div class="team-score" id="dispScoreA">0</div>
    </div>
    <div class="divider"></div>
    <div class="team b" id="teamB">
      <div class="team-name" id="dispNameB">ทีม B</div>
      <div class="team-score" id="dispScoreB">0</div>
    </div>
    <div class="vs">VS</div>
  </div>
</div>

<div id="connectingOverlay" class="connecting-overlay hidden">กำลังเชื่อมต่อ...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ============================================
  // Firebase config ของคุณ
  // ============================================
  const firebaseConfig = {
    apiKey: "AIzaSyBJ0gDwu1MEvetUQuJnAEGdntjpRgsz6mo",
    authDomain: "score-app-a1571.firebaseapp.com",
    projectId: "score-app-a1571",
    storageBucket: "score-app-a1571.firebasestorage.app",
    messagingSenderId: "1024620222075",
    appId: "1:1024620222075:web:f5abdb4e3f1d19931d34de",
  };
  const SCORE_DOC_PATH = { collection: "scoreboard", doc: "current" };
  const DEFAULT_STATE = {
    scoreA: 0, scoreB: 0,
    nameA: "ทีม A", nameB: "ทีม B",
    colorA: "#3b82f6", colorB: "#ef4444",
  };

  // ---------- สลับโหมดตาม URL parameter ----------
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("mode"); // "display" | "control" | null

  const homeEl = document.getElementById("home");
  const controlEl = document.getElementById("controlView");
  const displayEl = document.getElementById("displayView");
  const overlay = document.getElementById("connectingOverlay");

  if (mode === "control") {
    homeEl.classList.add("hidden");
    controlEl.style.display = "flex";
    overlay.classList.remove("hidden");
    runControlMode();
  } else if (mode === "display") {
    homeEl.classList.add("hidden");
    displayEl.style.display = "block";
    overlay.classList.remove("hidden");
    runDisplayMode();
  }
  // ถ้าไม่มี mode -> แสดงหน้าแรกเฉยๆ ไม่ต้องต่อ Firebase

  function initFirebase() {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    return doc(db, SCORE_DOC_PATH.collection, SCORE_DOC_PATH.doc);
  }

  // ================= โหมด Control =================
  async function runControlMode() {
    const scoreRef = initFirebase();
    const statusText = document.getElementById("statusText");

    const els = {
      scoreA: document.getElementById("scoreA"),
      scoreB: document.getElementById("scoreB"),
      nameA: document.getElementById("nameA"),
      nameB: document.getElementById("nameB"),
      colorA: document.getElementById("colorA"),
      colorB: document.getElementById("colorB"),
    };

    let isTypingName = false;
    let saveNameTimeout = null;

    try {
      const snap = await getDoc(scoreRef);
      if (!snap.exists()) await setDoc(scoreRef, DEFAULT_STATE);
    } catch (err) {
      statusText.textContent = "เชื่อมต่อ Firebase ไม่สำเร็จ ตรวจสอบ config และ Rules";
      statusText.classList.add("error");
      console.error(err);
    }

    onSnapshot(scoreRef, (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();
      els.scoreA.textContent = data.scoreA ?? 0;
      els.scoreB.textContent = data.scoreB ?? 0;
      document.documentElement.style.setProperty("--team-a-color", data.colorA || "#3b82f6");
      document.documentElement.style.setProperty("--team-b-color", data.colorB || "#ef4444");
      if (!isTypingName) {
        if (document.activeElement !== els.nameA) els.nameA.value = data.nameA ?? "ทีม A";
        if (document.activeElement !== els.nameB) els.nameB.value = data.nameB ?? "ทีม B";
        els.colorA.value = data.colorA || "#3b82f6";
        els.colorB.value = data.colorB || "#ef4444";
      }
      overlay.classList.add("hidden");
    }, (err) => {
      statusText.textContent = "การเชื่อมต่อขาดหาย กำลังลองใหม่...";
      statusText.classList.add("error");
      console.error(err);
    });

    function addScore(team, delta) {
      const field = team === "A" ? "scoreA" : "scoreB";
      updateDoc(scoreRef, { [field]: increment(delta) }).catch((err) => {
        statusText.textContent = "บันทึกคะแนนไม่สำเร็จ ลองใหม่อีกครั้ง";
        statusText.classList.add("error");
        console.error(err);
      });
    }

    document.getElementById("plusA").addEventListener("click", () => addScore("A", 1));
    document.getElementById("minusA").addEventListener("click", () => addScore("A", -1));
    document.getElementById("plusB").addEventListener("click", () => addScore("B", 1));
    document.getElementById("minusB").addEventListener("click", () => addScore("B", -1));

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("ยืนยันรีเซ็ตคะแนนทั้งสองทีมเป็น 0 ?")) {
        updateDoc(scoreRef, { scoreA: 0, scoreB: 0 }).catch(console.error);
      }
    });

    function debounceSaveNames() {
      clearTimeout(saveNameTimeout);
      saveNameTimeout = setTimeout(() => {
        updateDoc(scoreRef, {
          nameA: els.nameA.value || "ทีม A",
          nameB: els.nameB.value || "ทีม B",
        }).catch(console.error);
      }, 400);
    }

    [els.nameA, els.nameB].forEach((input) => {
      input.addEventListener("focus", () => { isTypingName = true; });
      input.addEventListener("blur", () => { isTypingName = false; });
      input.addEventListener("input", debounceSaveNames);
    });

    els.colorA.addEventListener("input", () => updateDoc(scoreRef, { colorA: els.colorA.value }).catch(console.error));
    els.colorB.addEventListener("input", () => updateDoc(scoreRef, { colorB: els.colorB.value }).catch(console.error));
  }

  // ================= โหมด Display =================
  function runDisplayMode() {
    const scoreRef = initFirebase();
    const els = {
      scoreA: document.getElementById("dispScoreA"),
      scoreB: document.getElementById("dispScoreB"),
      nameA: document.getElementById("dispNameA"),
      nameB: document.getElementById("dispNameB"),
      board: document.getElementById("board"),
    };

    let prevA = null;
    let prevB = null;

    function pulse(el) {
      el.classList.remove("pulse");
      void el.offsetWidth;
      el.classList.add("pulse");
    }

    onSnapshot(scoreRef, (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();
      const a = data.scoreA ?? 0;
      const b = data.scoreB ?? 0;

      els.scoreA.textContent = a;
      els.scoreB.textContent = b;
      els.nameA.textContent = data.nameA || "ทีม A";
      els.nameB.textContent = data.nameB || "ทีม B";
      els.board.style.setProperty("--ca", data.colorA || "#3b82f6");
      els.board.style.setProperty("--cb", data.colorB || "#ef4444");

      if (prevA !== null && a !== prevA) pulse(els.scoreA);
      if (prevB !== null && b !== prevB) pulse(els.scoreB);
      prevA = a;
      prevB = b;

      overlay.classList.add("hidden");
    }, (err) => console.error(err));
  }
</script>
</body>
</html>
